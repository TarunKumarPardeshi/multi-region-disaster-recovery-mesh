version: '3.8'

services:
  # Primary Region API Node (Canada)
  api-primary-canada:
    build: .
    container_name: dr-api-ca-central-1
    ports:
      - "8001:8000"
    environment:
      - AWS_REGION=ca-central-1
      - REGION_ROLE=primary

  # Secondary Region API Node (US)
  api-secondary-us:
    build: .
    container_name: dr-api-us-east-1
    ports:
      - "8002:8000"
    environment:
      - AWS_REGION=us-east-1
      - REGION_ROLE=secondary
